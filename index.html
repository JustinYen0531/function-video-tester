<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驗收影片中心</title>
<style>
:root{font-family:"Microsoft JhengHei",sans-serif;color:#e9edf5;background:#111622;color-scheme:dark}body{margin:0}header{padding:32px 6%;border-bottom:1px solid #30394c;background:#192131}h1{margin:0 0 12px;font-size:30px}p{line-height:1.7;color:#aeb9cd}main{max-width:1250px;margin:auto;padding:28px}nav{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}select,textarea,button{font:inherit;padding:10px;border:1px solid #44516b;border-radius:8px;background:#202a3c;color:#e9edf5}button{cursor:pointer;background:#345dc2}button.danger{background:#663a46}textarea{box-sizing:border-box;width:100%;min-height:90px}article{border:1px solid #34425c;border-radius:16px;background:#192131;margin:20px 0;padding:24px}.badge{display:inline-block;padding:5px 10px;background:#39405b;border-radius:8px;margin:0 8px 8px 0}.wait{background:#715324}h2{margin:10px 0}video{width:100%;max-height:520px;background:#000;border-radius:10px}table{width:100%;border-collapse:collapse;margin:15px 0}td,th{text-align:left;padding:10px;border-bottom:1px solid #34425c;vertical-align:top}label{display:block;margin:14px 0 8px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.message{color:#ffdb88;white-space:pre-wrap}.details{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#aeb9cd}summary{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #b7d1ff}
</style><header><h1>驗收影片中心</h1><p>影片留在這台電腦。先看需要你確認的項目，再決定是否通過。</p><span id="counts"></span></header><main><nav><select id="project" aria-label="篩選專案"><option value="">全部專案</option></select><select id="status" aria-label="篩選狀態"><option value="">全部狀態</option><option value="pending">待審查</option><option value="changes">需要修改</option><option value="approved">人工通過</option></select><button id="refresh">重新整理</button></nav><p id="message" class="message" role="status"></p><section id="list"></section></main>
<script>
const token='__TOKEN__',names={pending:'待審查',approved:'人工通過',changes:'需要修改'};let rows=[];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const response=await fetch('/api/records');if(!response.ok)throw Error('讀取失敗');rows=await response.json();const selected=$('project').value;$('project').innerHTML='<option value="">全部專案</option>'+[...new Set(rows.map(r=>r.project))].map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');$('project').value=selected;$('counts').textContent=`${rows.filter(r=>r.category==='confirmation'&&r.status!=='approved').length} 項等待確認 · ${rows.filter(r=>r.status==='pending').length} 項待審查`;render();}catch(e){$('message').textContent=e.message;}}
function render(){const filtered=rows.filter(r=>(!$('project').value||r.project===$('project').value)&&(!$('status').value||r.status===$('status').value)).sort((a,b)=>Number(b.category==='confirmation'&&b.status!=='approved')-Number(a.category==='confirmation'&&a.status!=='approved')||b.createdAt.localeCompare(a.createdAt));$('list').innerHTML=filtered.length?filtered.map(r=>`<article data-id="${r.id}"><span class="badge">${esc(r.project)}</span><span class="badge">${names[r.status]}</span>${r.category==='confirmation'&&r.status!=='approved'?'<span class="badge wait">等待你確認後才能推進相關工作</span>':''}<h2>${esc(r.ticket)}</h2><small>${esc(new Date(r.createdAt).toLocaleString('zh-TW'))} · 版本 ${esc(r.version||'未提供')}</small><p class="details">分類理由：${esc(r.reason)}<br>實際結果：${esc(r.result)}</p>${r.videoAvailable?`<video controls preload="metadata" src="/api/records/${r.id}/video"></video><p>若影片格式無法在網頁播放，可用 <a href="/api/records/${r.id}/video" download>下載影片</a> 後以本機播放器開啟。</p>`:`<p>${r.videoDeletedAt?'影片已刪除，驗收紀錄仍保留。':r.video?'原影片已移動或無法讀取。':'這次沒有影片；請看實際結果中的原因。'}</p>`}<table><thead><tr><th>時間點</th><th>測試功能</th><th>觀察結果</th></tr></thead><tbody>${r.items.map(i=>`<tr><td>${esc(i.time)}</td><td>${esc(i.feature)}</td><td>${esc(i.result)}</td></tr>`).join('')}</tbody></table><p class="details">未測項目：${esc(r.untested.join('；')||'未列出')}<br>失敗與重試：${esc(r.retries.join('；')||'無')}</p><label>調整分類 <select class="category"><option value="confirmation" ${r.category==='confirmation'?'selected':''}>新方向／新流程／展示／不確定：等待確認</option><option value="maintenance" ${r.category==='maintenance'?'selected':''}>成熟功能日常維護：交付後可繼續</option></select></label><label>你的修改意見<textarea class="comments">${esc(r.comments)}</textarea></label><div class="actions"><button data-action="approved">人工通過</button><button data-action="changes">需要修改</button><button data-action="pending">保留待審查／儲存意見</button>${r.video?'<button class="danger" data-action="delete">刪除影片，保留紀錄</button>':''}</div><details><summary>過去審查紀錄（${r.history.length}）</summary>${r.history.map(h=>`<p class="details">${esc(new Date(h.at).toLocaleString('zh-TW'))} · ${names[h.status]}<br>${esc(h.comments)}</p>`).join('')}</details></article>`).join(''):'<article><h2>目前沒有符合的紀錄</h2><p>錄製後使用登記工具加入影片。尚未錄影的失敗也可以登記，請寫明原因。</p></article>';}
$('list').addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button)return;const card=button.closest('article'),row=rows.find(r=>r.id===card.dataset.id),action=button.dataset.action;let body,route='review';if(action==='delete'){const answer=prompt('將永久刪除原始影片，釋放空間。驗收紀錄保留。請輸入工作項目名稱確認：\n'+row.ticket);if(answer!==row.ticket)return;body={confirm:answer};route='delete-video';}else{if(action==='approved'&&!confirm('確認由你人工審查通過這項工作？'))return;body={status:action,category:card.querySelector('.category').value,comments:card.querySelector('.comments').value};}button.disabled=true;try{const response=await fetch(`/api/records/${row.id}/${route}`,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error);$('message').textContent='已儲存。';await load();}catch(e){$('message').textContent=e.message;button.disabled=false;}});
$('project').onchange=render;$('status').onchange=render;$('refresh').onclick=load;load();
</script></html>
